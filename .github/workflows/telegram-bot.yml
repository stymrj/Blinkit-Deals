name: Telegram deal alerts

on:
  schedule:
    - cron: '1,31 3-18 * * *'   # every 30 min, 03:01-18:31 UTC = 08:31-00:01 IST (GitHub cron is UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the messages instead of sending them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  secrets:
    # Skip the run with a warning, instead of failing it, until the secrets
    # this bot needs are set (Settings -> Secrets and variables -> Actions).
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check required secrets
        id: check
        env:
          BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
          BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=""
          for k in BLINKIT_LAT BLINKIT_LON; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ "$DRY_RUN" != "true" ]; then
            for k in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do [ -n "${!k}" ] || missing="$missing $k"; done
          fi
          if [ -n "$missing" ]; then
            echo "::warning title=Skipped - secrets not set::Add these repository secrets to enable this workflow:$missing (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: secrets
    if: needs.secrets.outputs.ok == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
      BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
      BLINKIT_COOKIE: ${{ secrets.BLINKIT_COOKIE }}
      BLINKIT_LOCATIONS: ${{ vars.BLINKIT_LOCATIONS }}
      MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT }}
      THRESHOLDS: ${{ vars.THRESHOLDS }}
      GROUPS: ${{ vars.GROUPS }}
      PAGES: ${{ vars.PAGES }}
      DIGEST_HOUR_IST: ${{ vars.DIGEST_HOUR_IST }}
      MAX_WORKERS: ${{ vars.MAX_WORKERS }}
      MAX_ALERTS: ${{ vars.MAX_ALERTS }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore last run
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Scan and alert
        run: node bot/run.js
      - name: Remember this run
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
